services:
  - type: web
    name: ward-recipe-book
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --timeout 120
    envVars:
      # Cookbook branding (name, accent colors, icons) is resolved per-request
      # from the domain in cookbooks.py, not from an env var - this one
      # service now answers for all three cookbooks' custom domains.
      - key: ADMIN_PASSWORD_UW
        sync: false
      - key: ADMIN_PASSWORD_D1
        sync: false
      - key: ADMIN_PASSWORD_FAMILY
        sync: false
      - key: SUPERADMIN_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: recipe-photos
      - key: DATABASE_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: ADMIN_NOTIFY_EMAIL
        sync: false
