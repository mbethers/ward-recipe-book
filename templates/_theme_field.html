{# Reusable theme-tag picker: dropdown of existing themes + "add a new theme" toggle.
   Include with {% with field_prefix = "unique" %}{% include "_theme_field.html" %}{% endwith %} #}
<label>Theme
  <select name="theme_tag" id="{{ field_prefix }}_theme_tag" onchange="window.__toggleNewTheme && window.__toggleNewTheme(this)">
    {% for t in themes %}
      <option value="{{ t.name }}" {% if t.is_current %}selected{% endif %}>{{ t.name }}</option>
    {% endfor %}
    <option value="__new__">+ Add a new theme...</option>
  </select>
</label>
<label class="new-theme-field" id="{{ field_prefix }}_new_theme_wrap" style="display:none">
  New theme name
  <input type="text" name="new_theme" id="{{ field_prefix }}_new_theme" placeholder="e.g. Soup Sunday">
</label>
