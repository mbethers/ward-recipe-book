{% extends "base.html" %}
{% block title %}Add a recipe - {{ ward_name }} Recipe Book{% endblock %}
{% block content %}

<h1>Add a recipe</h1>

<div class="tab-row">
  <button type="button" class="tab-btn tab-active" data-tab="type">✏️ Type it in</button>
  <button type="button" class="tab-btn" data-tab="photo">📷 Upload a photo or PDF</button>
</div>

<form id="form-type" class="tab-panel tab-panel-active" method="post" action="{{ url_for('submit_text') }}" enctype="multipart/form-data">
  <label>Recipe name
    <input type="text" name="name" required>
  </label>

  <label>Your name
    <input type="text" name="submitter_name" required>
  </label>

  <label>Category
    <select name="category">
      {% for c in categories %}<option value="{{ c }}">{{ c }}</option>{% endfor %}
    </select>
  </label>

  <label>Ingredients <span class="hint">(one per line)</span>
    <textarea name="ingredients" rows="6" placeholder="2 cups flour&#10;1 tsp salt&#10;..."></textarea>
  </label>

  <label>Instructions
    <textarea name="instructions" rows="6" placeholder="1. Preheat oven to 350...&#10;2. Mix..."></textarea>
  </label>

  <label>Story or memory <span class="hint">(optional)</span>
    <textarea name="story" rows="3" placeholder="Where did this recipe come from?"></textarea>
  </label>

  <label>Photo of the finished dish <span class="hint">(optional)</span>
    <input type="file" name="photo" accept="image/*">
  </label>

  <button type="submit" class="primary-btn">Submit recipe</button>
</form>

<form id="form-photo" class="tab-panel" method="post" action="{{ url_for('submit_photo') }}" enctype="multipart/form-data">
  <p class="hint">Snap a photo of a recipe card, or upload a PDF/screenshot. We'll read it automatically -
    an admin double-checks everything before it's published.</p>

  <label>Your name
    <input type="text" name="submitter_name" required>
  </label>

  <label>Photo or PDF of the recipe
    <input type="file" name="source_file" accept="image/*,.pdf,application/pdf" required>
  </label>

  <button type="submit" id="photo-submit-btn" class="primary-btn">Submit for reading</button>
</form>

<script src="{{ url_for('static', filename='app.js') }}"></script>
{% endblock %}
